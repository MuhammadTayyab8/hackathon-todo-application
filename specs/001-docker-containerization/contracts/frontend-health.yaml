openapi: 3.0.3
info:
  title: Frontend Health Check API
  description: Health check endpoint for Next.js frontend container
  version: 1.0.0
  contact:
    name: Todo App Team

servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://frontend:3000
    description: Container network

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the Next.js frontend application
      operationId: getFrontendHealth
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: '2026-01-31T12:00:00Z'
                service: frontend
                version: '1.0.0'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                timestamp: '2026-01-31T12:00:00Z'
                service: frontend
                version: '1.0.0'
                error: 'Service initialization failed'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
        - version
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Current health status of the service
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the health check
        service:
          type: string
          enum: [frontend]
          description: Service identifier
        version:
          type: string
          description: Application version
          example: '1.0.0'
        error:
          type: string
          description: Error message if service is unhealthy (optional)

  securitySchemes: {}

tags:
  - name: Health
    description: Health check operations for container orchestration
