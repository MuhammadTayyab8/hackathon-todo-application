openapi: 3.0.0
info:
  title: Todo App API
  version: 1.1.0
paths:
  /api/{user_id}/tasks:
    get:
      summary: List Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tasks with category details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
    post:
      summary: Create Task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'

  /api/{user_id}/tasks/{id}:
    get:
      summary: Get Task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
    put:
      summary: Update Task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'

components:
  schemas:
    TaskRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category_name:
          type: string
          nullable: true
        # ... other fields
    TaskCreate:
      type: object
      required:
        - title
        - category_id
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        category_id:
          type: integer
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        category_id:
          type: integer
        # ...
