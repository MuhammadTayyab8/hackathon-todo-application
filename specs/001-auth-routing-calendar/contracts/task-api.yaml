openapi: 3.0.0
info:
  title: Task API - Updated for Date Ranges
  version: 2.0.0
  description: |
    Task management API with authentication-aware routing and date range support.
    All endpoints require JWT authentication via Bearer token.

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todo-app.com
    description: Production server

paths:
  /api/{user_id}/tasks:
    get:
      summary: List all tasks for authenticated user
      description: Returns all tasks belonging to the authenticated user, including start_date and due_date fields
      operationId: listTasks
      parameters:
        - name: user_id
          in: path
          required: true
          description: UUID of the authenticated user
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (user_id does not match JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new task
      description: Creates a new task with optional start_date and due_date
      operationId: createTask
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '400':
          description: Validation error (e.g., start_date > due_date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                dateValidation:
                  value:
                    detail: "start_date cannot be after due_date"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/{user_id}/tasks/{task_id}:
    get:
      summary: Get single task
      description: Returns details of a specific task
      operationId: getTask
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (task does not belong to user)

    put:
      summary: Update task
      description: Updates an existing task, including start_date and due_date
      operationId: updateTask
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '400':
          description: Validation error (e.g., start_date > due_date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    delete:
      summary: Delete task
      description: Permanently deletes a task
      operationId: deleteTask
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

components:
  schemas:
    TaskRead:
      type: object
      required:
        - id
        - user_id
        - title
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier
        user_id:
          type: string
          format: uuid
          description: Owner user ID
        title:
          type: string
          minLength: 1
          description: Task title
        description:
          type: string
          nullable: true
          description: Optional task description
        start_date:
          type: string
          format: date-time
          nullable: true
          description: "NEW: Task start date (ISO 8601 format)"
          example: "2026-01-15T09:00:00Z"
        due_date:
          type: string
          format: date-time
          nullable: true
          description: "Task end/due date (ISO 8601 format)"
          example: "2026-01-20T17:00:00Z"
        category_id:
          type: integer
          nullable: true
          description: Category ID (foreign key)
        category_name:
          type: string
          nullable: true
          description: Denormalized category name for display
        completed:
          type: boolean
          description: Task completion status
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    TaskCreate:
      type: object
      required:
        - title
        - category_id
      properties:
        title:
          type: string
          minLength: 1
          description: Task title
          example: "Complete project proposal"
        category_id:
          type: integer
          description: Category ID
          example: 1
        description:
          type: string
          nullable: true
          description: Optional task description
          example: "Draft and finalize Q1 project proposal"
        start_date:
          type: string
          format: date-time
          nullable: true
          description: "NEW: Optional task start date (ISO 8601)"
          example: "2026-01-15T09:00:00Z"
        due_date:
          type: string
          format: date-time
          nullable: true
          description: "Optional task due date (ISO 8601)"
          example: "2026-01-20T17:00:00Z"

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Task title
        category_id:
          type: integer
          description: Category ID
        description:
          type: string
          nullable: true
          description: Task description
        start_date:
          type: string
          format: date-time
          nullable: true
          description: "NEW: Task start date (ISO 8601)"
        due_date:
          type: string
          format: date-time
          nullable: true
          description: "Task due date (ISO 8601)"
        completed:
          type: boolean
          description: Task completion status

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message
          example: "start_date cannot be after due_date"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from Better Auth.
        Include in Authorization header: `Bearer <token>`

security:
  - BearerAuth: []
