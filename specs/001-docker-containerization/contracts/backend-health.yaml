openapi: 3.0.3
info:
  title: Backend Health Check API
  description: Health check endpoint for FastAPI backend container
  version: 1.0.0
  contact:
    name: Todo App Team

servers:
  - url: http://localhost:8000
    description: Local development
  - url: http://backend:8000
    description: Container network

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the FastAPI backend application including database connectivity
      operationId: getBackendHealth
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: '2026-01-31T12:00:00Z'
                service: backend
                version: '1.0.0'
                database: connected
        '503':
          description: Service or database is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                timestamp: '2026-01-31T12:00:00Z'
                service: backend
                version: '1.0.0'
                database: disconnected
                error: 'Database connection failed'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
        - version
        - database
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Current health status of the service
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the health check
        service:
          type: string
          enum: [backend]
          description: Service identifier
        version:
          type: string
          description: Application version
          example: '1.0.0'
        database:
          type: string
          enum: [connected, disconnected]
          description: Database connection status
        error:
          type: string
          description: Error message if service is unhealthy (optional)

  securitySchemes: {}

tags:
  - name: Health
    description: Health check operations for container orchestration
